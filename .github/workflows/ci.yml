name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # reads Ruby version from .ruby-version automatically

      - name: Run test suite
        run: bundle exec rspec

      - name: Report coverage
        run: cat coverage/.last_run.json

  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check for known-vulnerable dependencies
        run: bundle exec bundle-audit check --update
